<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Volition{% endblock %}</title>
<link rel="icon" href="/assets/ms-mark.svg">
<style>
  @font-face { font-family: "JetBrains Mono"; font-weight: 400; src: url("/assets/fonts/JetBrainsMono-Regular.ttf") format("truetype"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 500; src: url("/assets/fonts/JetBrainsMono-Medium.ttf") format("truetype"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 600; src: url("/assets/fonts/JetBrainsMono-SemiBold.ttf") format("truetype"); }

  :root {
    --paper: #FFFFFF; --paper-sunken: #F4F4F2; --line: #E2E2DF;
    --ink: #111111; --ink-muted: #6B6B68; --signal: #C8341B; --signal-soft: #FBEAE6; --on-signal: #FFFFFF;
    --space-1: 4px; --space-2: 8px; --space-4: 16px; --space-8: 32px;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #111111; --paper-sunken: #1B1B1A; --line: #333331;
      --ink: #F2F2F0; --ink-muted: #9A9A96; --signal: #FF7A5C; --signal-soft: #3A1710; --on-signal: #111111;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
    font: 13px/20px "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace; }
  main { max-width: 800px; margin: 0 auto; padding: var(--space-8) var(--space-4); }

  header { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-4);
    padding-bottom: var(--space-4); border-bottom: 1px solid var(--ink); }
  h1 { margin: 0; font-size: 17px; line-height: 24px; font-weight: 600; }

  fieldset { border: 0; margin: var(--space-8) 0 0; padding: 0; min-width: 0; }
  legend { padding: 0; margin-bottom: var(--space-4); }
  .label, legend { font-size: 11px; line-height: 16px; font-weight: 500; letter-spacing: .08em;
    text-transform: uppercase; color: var(--ink-muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: var(--space-4); }
  .wide { grid-column: 1 / -1; }
  label { display: flex; flex-direction: column; gap: var(--space-1); }
  .hint { font-size: 11px; line-height: 16px; color: var(--ink-muted); }

  input, select, textarea, button { font: inherit; color: inherit; }
  input, select, textarea { width: 100%; padding: 6px var(--space-2); background: var(--paper);
    border: 1px solid var(--line); border-radius: 2px; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--ink); outline-offset: -1px; border-color: var(--ink); }
  input[type=number] { text-align: right; font-variant-numeric: tabular-nums; }
  textarea { resize: vertical; }
  label.check { flex-direction: row; align-items: center; gap: var(--space-2); align-self: end;
    min-height: 34px; cursor: pointer; }
  input[type=checkbox] { width: 16px; height: 16px; margin: 0; accent-color: var(--ink); }
  .prefixed { display: flex; align-items: center; gap: var(--space-2); }

  table { width: 100%; border-collapse: collapse; }
  th { background: var(--paper-sunken); border-bottom: 1px solid var(--ink); padding: var(--space-2);
    text-align: left; }
  th.num { text-align: right; }
  td { padding: var(--space-2) var(--space-2) var(--space-2) 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  td:first-child { padding-left: 0; }
  .stack { display: flex; flex-direction: column; gap: var(--space-1); }
  .col-qty { width: 96px; } .col-rate { width: 120px; } .col-x { width: 32px; }

  button { cursor: pointer; border-radius: 4px; border: 1px solid var(--line); background: var(--paper);
    padding: 6px var(--space-4); }
  button:hover { border-color: var(--ink); }
  button.remove { padding: 6px 0; width: 32px; color: var(--ink-muted); }
  button.add { margin-top: var(--space-4); }
  button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); font-weight: 600; }
  button.primary:disabled { opacity: .6; cursor: progress; }

  .actions { display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap;
    margin-top: var(--space-8); padding-top: var(--space-4); border-top: 1px solid var(--line); }
  .status:empty { display: none; }
  .errors { margin: var(--space-4) 0 0; padding: var(--space-4); padding-left: var(--space-8);
    background: var(--signal-soft); color: var(--signal); }
  .errors:empty { display: none; }
  a { color: inherit; }

  @media (max-width: 600px) {
    thead { display: none; }
    tr { display: grid; grid-template-columns: 1fr 1fr 32px; gap: var(--space-2); padding: var(--space-2) 0;
      border-bottom: 1px solid var(--line); }
    td, td.col-qty, td.col-rate { display: block; width: auto; padding: 0; border: 0; }
    td.col-desc { grid-column: 1 / -1; }
  }

  nav { display: flex; gap: var(--space-4); }
  nav a { text-decoration: none; color: var(--ink-muted); }
  nav a:hover, nav a[aria-current=page] { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }
  .summary { margin: 0; padding: var(--space-2) 0 0; list-style: none; }
  .summary:empty { display: none; }
  .empty { margin: 0; color: var(--ink-muted); }
  button.danger { color: var(--signal); margin-left: auto; }
  button.danger:hover { border-color: var(--signal); }
  a.button { display: inline-block; text-decoration: none; border-radius: 4px; border: 1px solid var(--line);
    padding: 6px var(--space-4); }
  a.button:hover { border-color: var(--ink); }
  .brand { display: flex; align-items: baseline; gap: var(--space-8); flex-wrap: wrap; }
</style>
</head>
<body>
<main>
  <header>
    <div class="brand">
      <h1>Volition</h1>
      <nav>
        <a href="/" {% if page == "invoice" %}aria-current="page"{% endif %}>Invoice</a>
        <a href="/clients" {% if page == "clients" %}aria-current="page"{% endif %}>Clients</a>
      </nav>
    </div>
    <span class="label">{{ supplier.legalName }}</span>
  </header>
{% block content %}{% endblock %}
</main>
{% block script %}{% endblock %}
</body>
</html>
